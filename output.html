<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina</title>
    <style>
        :root {
            /* Light mode variables */
            --bg-color: #f5f5f7;
            --toolbar-bg: rgba(255, 255, 255, 0.72);
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --apple-blue: #0071e3;
            --apple-blue-hover: #0077ed;
            --btn-secondary-bg: #ffffff;
            --btn-secondary-border: #d2d2d7;
            --btn-secondary-hover: #f5f5f7;
            --scroll-thumb: rgba(0, 0, 0, 0.2);
            --scroll-thumb-hover: rgba(0, 0, 0, 0.35);
            --zoom-bg: rgba(255, 255, 255, 0.85);
            --zoom-btn-hover: rgba(0, 0, 0, 0.05);
            --zoom-btn-active: rgba(0, 0, 0, 0.1);
        }

        body.dark-mode {
            /* Premium Black Dark Mode variables */
            --bg-color: #000000;
            --toolbar-bg: rgba(28, 28, 30, 0.75);
            --text-main: #f5f5f7;
            --text-muted: #a1a1a6;
            --apple-blue: #0a84ff;
            --apple-blue-hover: #409cff;
            --btn-secondary-bg: #1c1c1e;
            --btn-secondary-border: #38383a;
            --btn-secondary-hover: #2c2c2e;
            --scroll-thumb: rgba(255, 255, 255, 0.2);
            --scroll-thumb-hover: rgba(255, 255, 255, 0.35);
            --zoom-bg: rgba(44, 44, 46, 0.85);
            --zoom-btn-hover: rgba(255, 255, 255, 0.1);
            --zoom-btn-active: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Seamless Mac-style Header */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--toolbar-bg);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 0.5px solid rgba(128, 128, 128, 0.2);
            padding: 14px 28px;
            z-index: 50;
            transition: background 0.3s ease;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand h1 {
            font-size: 19px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .meta-info {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            background: rgba(128, 128, 128, 0.1);
            padding: 4px 10px;
            border-radius: 12px;
            display: none;
            letter-spacing: 0.01em;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        /* Apple-style Buttons */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn.btn-icon-only {
            padding: 6px 8px;
        }

        .btn svg {
            width: 16px;
            height: 16px;
        }

        .btn-primary {
            background: var(--apple-blue);
            color: white;
            border: 1px solid transparent;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .btn-primary:hover {
            background: var(--apple-blue-hover);
        }
        
        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: var(--btn-secondary-bg);
            color: var(--text-main);
            border: 1px solid var(--btn-secondary-border);
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }

        .btn-secondary:hover {
            background: var(--btn-secondary-hover);
        }
        
        .btn-secondary:active {
            transform: scale(0.97);
            background: var(--btn-secondary-hover);
        }

        .divider {
            width: 1px;
            height: 20px;
            background: rgba(128, 128, 128, 0.3);
            margin: 0 4px;
            align-self: center;
        }

        .btn-icon-bare {
            background: transparent;
            border: none;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: background 0.2s ease;
        }

        .btn-icon-bare:hover {
            background: var(--btn-secondary-hover);
        }

        .btn-icon-bare svg {
            width: 20px;
            height: 20px;
        }

        /* Workspace & Canvas */
        .workspace {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .preview-container {
            flex-grow: 1;
            padding: 50px;
            overflow: auto;
            text-align: center;
        }

        /* Refined Mac Scrollbar */
        .preview-container::-webkit-scrollbar {
            width: 14px;
            height: 14px;
        }
        .preview-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .preview-container::-webkit-scrollbar-thumb {
            background: var(--scroll-thumb);
            border-radius: 10px;
            border: 4px solid var(--bg-color);
            background-clip: content-box;
        }
        .preview-container::-webkit-scrollbar-thumb:hover {
            background-color: var(--scroll-thumb-hover);
        }

        .preview-wrapper {
            background: transparent;
            border-radius: 12px;
            display: inline-block;
            vertical-align: top;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.2), 0 0 1px rgba(128,128,128,0.2);
            position: relative;
            
            transition: opacity 0.6s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
            transform: translateY(20px) scale(0.98);
        }

        .preview-wrapper.loaded {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #screenshot-preview {
            display: block;
            border-radius: 12px;
            transition: width 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        /* Floating Minimalist Zoom Controls */
        .zoom-controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            background: var(--zoom-bg);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border: 1px solid rgba(128,128,128,0.15);
            border-radius: 20px;
            padding: 4px;
            gap: 2px;
            z-index: 20;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1), 0 0 1px rgba(0,0,0,0.05);
            transition: background 0.3s ease;
        }

        .zoom-btn {
            background: transparent;
            color: var(--text-main);
            border: none;
            border-radius: 16px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .zoom-btn:hover {
            background: var(--zoom-btn-hover);
        }

        .zoom-btn:active {
            background: var(--zoom-btn-active);
            transform: scale(0.95);
        }
        
        .zoom-level {
            font-size: 13px;
            font-weight: 500;
            min-width: 48px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            color: var(--text-main);
        }

        /* Minimalist Spinner */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            transition: opacity 0.3s ease;
        }

        #loading p {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: -0.01em;
        }

        .mac-spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(128, 128, 128, 0.2);
            border-top-color: var(--text-muted);
            border-radius: 50%;
            animation: mac-spin 1s linear infinite;
        }

        @keyframes mac-spin {
            to { transform: rotate(360deg); }
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.show {
            opacity: 1;
        }

        .modal-content {
            background: var(--bg-color);
            padding: 24px;
            border-radius: 12px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--btn-secondary-border);
            transform: scale(0.95) translateY(10px);
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.show .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-content h2 {
            font-size: 18px;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .modal-content p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .modal-content input[type="email"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--btn-secondary-border);
            background: var(--btn-secondary-bg);
            color: var(--text-main);
            font-family: inherit;
            font-size: 13px;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .modal-content input[type="email"]:focus {
            border-color: var(--apple-blue);
        }

        .modal-content textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--btn-secondary-border);
            background: var(--btn-secondary-bg);
            color: var(--text-main);
            font-family: inherit;
            font-size: 13px;
            resize: vertical;
            min-height: 100px;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .modal-content textarea:focus {
            border-color: var(--apple-blue);
        }

        .report-status-msg {
            font-size: 12px;
            margin-bottom: 14px;
            min-height: 16px;
            transition: all 0.2s ease;
        }

        .report-status-msg.error {
            color: #ff3b30;
        }

        .report-status-msg.success {
            color: #34c759;
            font-weight: 500;
        }

        .modal-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="brand">
            <h1>Lumina</h1>
            <div id="meta-info" class="meta-info"></div>
        </div>
        <div class="actions">
            <!-- Dark Mode Toggle -->
            <button id="toggle-dark-mode" class="btn btn-secondary btn-icon-only" title="Toggle Dark Mode">
                <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
                </svg>
                <svg id="sun-icon" style="display: none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
                </svg>
            </button>
            <button id="copy-clipboard" class="btn btn-secondary" title="Copy to Clipboard">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184" />
                </svg>
                Copy
            </button>
            <button id="edit-btn" class="btn btn-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                </svg>
                Edit
            </button>
            <button id="download-pdf" class="btn btn-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
                </svg>
                PDF
            </button>
            <button id="download-png" class="btn btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
                </svg>
                Save PNG
            </button>
            <div class="divider"></div>
            <button id="report-issue-btn" class="btn-icon-bare" title="Report an Issue">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M7.5 18H15l4.5 4.5V4.5A1.5 1.5 0 0 0 18 3H6A1.5 1.5 0 0 0 4.5 4.5v13.5A1.5 1.5 0 0 0 6 19.5h1.5Z" />
                </svg>
            </button>
        </div>
    </div>
    
    <div class="workspace">
        <div id="loading">
            <div class="mac-spinner"></div>
            <p>Rendering capture...</p>
        </div>
        
        <div class="preview-container">
            <div class="preview-wrapper" style="display: none;">
                <img id="screenshot-preview" alt="Screenshot Preview">
            </div>
        </div>

        <div class="zoom-controls" style="display: none;">
            <button class="zoom-btn" id="zoom-out" title="Zoom Out">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:16px;height:16px;">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14" />
                </svg>
            </button>
            <span class="zoom-level" id="zoom-level-text">100%</span>
            <button class="zoom-btn" id="zoom-in" title="Zoom In">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:16px;height:16px;">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
            </button>
            <button class="zoom-btn" id="zoom-reset" title="Reset Zoom">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:16px;height:16px;">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Report Issue Modal -->
    <div id="report-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>Report an Issue</h2>
            <p>Please describe the issue you are experiencing:</p>
            <input type="email" id="report-user-email" placeholder="Your email (optional, for reply)">
            <textarea id="issue-description" rows="5" placeholder="Enter details here..."></textarea>
            <div id="report-status" class="report-status-msg"></div>
            <div class="modal-actions">
                <button id="cancel-report" class="btn btn-secondary">Cancel</button>
                <button id="send-report" class="btn btn-primary">Send report</button>
            </div>
        </div>
    </div>

    <!-- jspdf library for PDF export -->
    <script src="jspdf.umd.min.js"></script>
    <script src="output.js"></script>
</body>
</html>
